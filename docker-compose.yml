services:
  tests:
    build: .
    container_name: booker-api-tests
    environment:
      TEST_ENV: ${TEST_ENV:-dev}
      BOOKER_USERNAME: ${BOOKER_USERNAME}
      BOOKER_PASSWORD: ${BOOKER_PASSWORD}
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
    # Тесты + Allure-отчёт одной командой; exit code pytest сохраняется
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rm -rf /app/allure-results/* /app/allure-report/*
        && pytest --env=$${TEST_ENV:-dev}
        ; EXIT=$$?
        ; allure generate /app/allure-results -o /app/allure-report --clean
        ; exit $$EXIT
